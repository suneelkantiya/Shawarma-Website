<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maya Chicken Shawarma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Nunito+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --red:#c4161c; --red2:#9f0f14; --yel:#ffc40c; --ink:#2a1a14; --mute:#6f5d54; --bg:#fbf6ee; --card:#fff; --line:#eadfce;
  box-sizing:border-box;
}
html{scroll-behavior:smooth;scroll-padding-top:130px}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito Sans",system-ui,sans-serif;line-height:1.45;padding-bottom:90px;padding-top:env(safe-area-inset-top,0px)}
h1,h2,h3,.slab{font-family:"Alfa Slab One",Georgia,serif;font-weight:400;margin:0}
button{font-family:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}

/* header */
.head{background:#fff;border-bottom:4px solid var(--red)}
.head .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px;height:64px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.brand img.lg{width:48px;height:48px;border-radius:12px;object-fit:cover}.pill.wa{background:#1fa855;color:#fff;border:0}.pill.wa:hover{background:#178a45}.brand i{width:44px;height:44px;border-radius:50%;background:var(--yel);border:3px solid var(--red);display:grid;place-items:center;font:normal 22px "Alfa Slab One",serif;color:var(--red)}
.brand b{font:400 22px "Alfa Slab One",serif;color:var(--red)}
.hbtns{display:flex;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--red);color:#fff;border:0;border-radius:10px;padding:10px 16px;font-weight:800;font-size:15px;text-decoration:none}
.pill.alt{background:#fff;color:var(--red);border:2px solid var(--red)}
.pill em{font-style:normal;background:var(--yel);color:var(--ink);border-radius:999px;min-width:22px;height:22px;display:grid;place-items:center;font-size:13px;padding:0 6px}

/* banner carousel */
.ban{margin-top:18px;position:relative;border-radius:22px;overflow:hidden}
.slides{display:flex;transition:transform .5s}
.slide{min-width:100%;display:grid;grid-template-columns:1.1fr .9fr;align-items:center;padding:28px 36px;min-height:280px;color:#fff}
.slide h2{font-size:clamp(28px,6vw,52px);line-height:1.02;text-transform:uppercase}
.slide p{font-size:18px;margin:10px 0 18px;max-width:28ch}
.slide .go{background:var(--yel);color:var(--ink);border:0;border-radius:999px;padding:12px 24px;font-weight:800;font-size:16px;text-decoration:none;display:inline-block}
.slide{position:relative}.slide img{width:100%;max-width:340px;justify-self:center;border-radius:18px;transform:rotate(-4deg);box-shadow:0 12px 24px rgba(0,0,0,.35)}
.s1{background:#2d8fd0}.s2{background:var(--red)}.s3{background:#14a04a}
.arr{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.9);font-size:22px;color:var(--ink)}
.arr.l{left:10px}.arr.r{right:10px}
.dots{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;gap:8px}
.dots button{width:10px;height:10px;border-radius:50%;border:0;background:rgba(255,255,255,.55);padding:0}
.dots button.on{background:#fff;width:26px;border-radius:6px}

/* category bar */
.cats{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--red);margin-top:18px;border-radius:14px}
.cats .in{display:flex;gap:4px;overflow-x:auto;padding:8px}
.cats button{flex:0 0 auto;background:none;border:0;color:#fff;font-weight:800;font-size:14px;text-transform:uppercase;letter-spacing:.02em;padding:11px 16px;border-radius:10px}
.cats button.on{background:var(--yel);color:var(--ink)}

/* sections + cards */
.sec{padding-top:30px}
.sec h2{font-size:26px;color:var(--red)}
.sec .hint{color:var(--mute);margin:2px 0 14px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.card{background:var(--card);border-radius:18px;padding:12px;display:flex;flex-direction:column;position:relative;box-shadow:0 2px 10px rgba(80,40,10,.08)}
.tag{position:absolute;top:10px;left:10px;background:var(--yel);color:var(--ink);font-size:11px;font-weight:800;padding:3px 10px;border-radius:999px;z-index:1}
.pic{height:150px;display:grid;place-items:center;background:#fdf1dc;border-radius:12px;margin-bottom:10px}
.pic svg{height:130px;width:auto;max-width:90%}.pic{position:relative;overflow:hidden}.pic.photo{background:#17120f}.pic img.ph{width:100%;height:100%;object-fit:cover;border-radius:0}.sz{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.7);color:#fff;font-size:12px;font-weight:800;padding:2px 10px;border-radius:999px}.pic img.bt{height:140px;width:auto;max-width:90%;border-radius:0;mix-blend-mode:multiply}.pic img{width:var(--w,90%);height:auto;border-radius:8px}
.card h3{font-family:"Nunito Sans",sans-serif;font-weight:800;font-size:17px;line-height:1.2}
.card .d{font-size:13px;color:var(--mute);margin:4px 0 10px;flex:1}
.pr{display:inline-block;background:var(--red);color:var(--yel);font-weight:800;font-size:17px;padding:2px 10px;border-radius:6px;align-self:flex-start;margin-bottom:10px}
.slot{min-height:42px}
.add{width:100%;background:var(--red);color:#fff;border:0;border-radius:10px;padding:11px;font-weight:800;font-size:15px}
.add:hover{background:var(--red2)}
.stp{display:flex;align-items:center;justify-content:space-between;background:#fff;border:2px solid var(--red);border-radius:10px;height:42px}
.stp button{width:44px;height:100%;border:0;background:none;color:var(--red);font-size:22px;font-weight:800}
.stp output{font-weight:800;font-size:16px}

.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}.chips button{border:2px solid var(--line);background:#fff;border-radius:999px;padding:4px 10px;font-weight:800;font-size:12px;color:var(--ink)}.chips button.on{border-color:var(--red);background:#fff1f1;color:var(--red)}
/* add-ons list */
.rows{background:var(--card);border-radius:18px;padding:4px 16px;box-shadow:0 2px 10px rgba(80,40,10,.08)}
.row{display:grid;grid-template-columns:1fr auto 130px;align-items:center;gap:12px;padding:12px 0;border-bottom:1px dashed var(--line)}
.row:last-child{border:0}
.row b{font-size:16px}.row small{display:block;color:var(--mute)}
.row .pr{margin:0}

footer{text-align:center;color:var(--mute);padding:34px 0 8px}
.info{background:var(--card);border-radius:18px;padding:18px 20px;margin-top:34px;box-shadow:0 2px 10px rgba(80,40,10,.08)}
.info h2{font-size:22px;color:var(--red);margin-bottom:6px}.info p{margin:6px 0}.info a{color:var(--red);font-weight:700}

/* order bar + sheet */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:#fff;border-top:3px solid var(--red);transform:translateY(110%);transition:transform .25s}
.bar.show{transform:none}
.bar button{width:100%;max-width:1100px;margin:0 auto;display:flex;justify-content:space-between;background:var(--red);color:#fff;border:0;border-radius:12px;padding:14px 20px;font-weight:800;font-size:17px}
.shade{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:none}
.shade.open{display:block}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92%;overflow:auto;background:#fff;border-radius:22px 22px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto}
.sheet h2{font-size:24px;color:var(--red);display:flex;justify-content:space-between;align-items:center}
.x{background:none;border:0;font-size:32px;line-height:1;color:var(--ink)}
.line{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.total{display:flex;justify-content:space-between;font-weight:800;font-size:20px;padding:14px 0}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 10px}
.seg label{border:2px solid var(--line);border-radius:12px;padding:12px;text-align:center;font-weight:800;cursor:pointer}
.seg input{position:absolute;opacity:0}
.seg label:has(input:checked){border-color:var(--red);background:#fff1f1;color:var(--red)}
.seg label:has(input:focus-visible){outline:3px solid var(--ink)}
.f{display:block;margin:10px 0}.f span{display:block;font-size:14px;color:var(--mute);margin-bottom:4px}
.f input,.f textarea{width:100%;border:2px solid var(--line);border-radius:12px;padding:12px;font:inherit;font-size:16px;color:var(--ink);background:#fff}
.send{display:block;text-align:center;background:var(--red);color:#fff;font-weight:800;font-size:17px;padding:14px;border-radius:12px;text-decoration:none;margin-top:6px}
.err{color:var(--red);font-size:14px;min-height:20px;margin:6px 0 0}

@media (max-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}
@media (max-width:680px){
  .grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .pic{height:120px}
  .slide{grid-template-columns:1fr;padding:22px 20px 34px;min-height:0;text-align:left}
  .slide img{max-width:150px;position:absolute;right:10px;bottom:28px}
  .slide p{max-width:16ch;font-size:15px}
  .brand b{display:none}
  .row{grid-template-columns:1fr auto;}.row .slot{grid-column:1/-1}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.slides,.bar{transition:none}}
</style>
</head>

let cur=0,timer;
function show(n){cur=(n+slides.length)%slides.length;$("slides").style.transform=`translateX(-${cur*100}%)`;[...$("dots").children].forEach((d,i)=>d.classList.toggle("on",i===cur))}
function auto(){clearInterval(timer);if(!matchMedia("(prefers-reduced-motion:reduce)").matches)timer=setInterval(()=>show(cur+1),5000)}
$("prev").onclick=()=>{show(cur-1);auto()};$("next").onclick=()=>{show(cur+1);auto()};
[...$("dots").children].forEach((d,i)=>d.onclick=()=>{show(i);auto()});

  return `<article class="card"><div class="pic">${f.img?`<img class="bt" src="${DRINKIMG[f.img]}" alt="${f.k}">`:drinkSvg(f)}</div><h3>${f.k}</h3><p class="d">Ice cold. Choose a size.</p>
  <div class="chips">${v.map((i,k)=>`<button data-chip="${i.id}" aria-pressed="${k===0}" class="${k?'':'on'}">${i.size}</button>`).join("")}</div>
  <span class="pr">Rs ${a.p}</span><div class="slot" data-id="${a.id}"></div></article>`};
const sections=[{id:"popular",name:"Popular items",hint:"What most people order",html:`<div class="grid">${pop.map(i=>card(i,.8)).join("")}</div>`}]
  .concat(groups.map(g=>({id:g.id,name:g.name,hint:g.hint||`${g.items.length} choices, from Rs ${g.items[0].p}`,
    html:g.kind==="list"?`<div class="rows">${g.items.map(i=>`<div class="row"><div><b>${i.n}</b><small>${i.d}</small></div><span class="pr">Rs ${i.p}</span>${slot(i)}</div>`).join("")}</div>`
      :g.kind==="drink"?`<div class="grid">${FLAVORS.map(drinkCard).join("")}</div>`
      :`<div class="grid">${g.items.map(i=>card(i)).join("")}</div>`})));
$("menu").innerHTML=sections.map(s=>`<section class="sec" id="${s.id}"><h2>${s.name}</h2><p class="hint">${s.hint}</p>${s.html}</section>`).join("");
$("cats").innerHTML=sections.map((s,k)=>`<button data-t="${s.id}" class="${k?'':'on'}">${s.name.replace(" items","")}</button>`).join("");

function renderSlot(el){
  const i=all.find(x=>x.id==el.dataset.id),q=cart[i.id]||0;
  el.innerHTML=q?`<div class="stp"><button data-id="${i.id}" data-d="-1" aria-label="Remove one ${i.n}">&minus;</button><output>${q}</output><button data-id="${i.id}" data-d="1" aria-label="Add one ${i.n}">+</button></div>`
    :`<button class="add" data-id="${i.id}" data-d="1" aria-label="Add ${i.n} to cart">Add to Cart</button>`;
}
function ctl(i){document.querySelectorAll(`.slot[data-id="${i.id}"]`).forEach(renderSlot)}
document.querySelectorAll(".slot").forEach(renderSlot);
document.addEventListener("click",e=>{
  const b=e.target.closest("button[data-id]");
  if(b){const host=b.closest(".slot"),id=b.dataset.id;cart[id]=Math.max(0,(cart[id]||0)+Number(b.dataset.d));ctl(all.find(x=>x.id==id));render();
    const nb=host.querySelector("button:last-child");if(nb)nb.focus()}
  const ch=e.target.closest("button[data-chip]");
  if(ch){const cd=ch.closest(".card"),sl=cd.querySelector(".slot"),i=all.find(x=>x.id==ch.dataset.chip);
    sl.dataset.id=i.id;cd.querySelector(".pr").textContent="Rs "+i.p;
    cd.querySelectorAll("[data-chip]").forEach(c=>{c.classList.toggle("on",c===ch);c.setAttribute("aria-pressed",c===ch)});renderSlot(sl)}
  const t=e.target.closest("[data-t]");if(t)$(t.dataset.t).scrollIntoView();
});
const io=new IntersectionObserver(es=>es.forEach(en=>{
  if(en.isIntersecting)document.querySelectorAll("#cats button").forEach(b=>b.classList.toggle("on",b.dataset.t===en.target.id));
}),{rootMargin:"-30% 0px -60% 0px"});
document.querySelectorAll(".sec").forEach(s=>io.observe(s));

/* cart */
const lines=()=>all.filter(i=>cart[i.id]>0);
const totals=()=>{const l=lines();return{l,count:l.reduce((s,i)=>s+cart[i.id],0),total:l.reduce((s,i)=>s+cart[i.id]*i.p,0)}};
function render(){
  const {l,count,total}=totals();
  $("bar").classList.toggle("show",count>0);
  $("hdrCount").textContent=count;
  $("barCount").textContent=count+(count===1?" item":" items");
  $("barTotal").textContent="Rs "+total;$("total").textContent="Rs "+total;
  $("lines").innerHTML=count?l.map(i=>`<div class="line"><span>${cart[i.id]} &times; ${i.n}</span><span>Rs ${cart[i.id]*i.p}</span></div>`).join(""):'<p class="hint">Your cart is empty. Tap Add to Cart on any item.</p>';
}
const openCart=()=>{$("shade").classList.add("open");$("closeCart").focus()};
const closeCart=()=>$("shade").classList.remove("open");
$("openCart").onclick=openCart;$("hdrCart").onclick=openCart;$("closeCart").onclick=closeCart;
$("shade").addEventListener("click",e=>{if(e.target.id==="shade")closeCart()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeCart()});
document.querySelectorAll("input[name=mode]").forEach(r=>r.onchange=()=>{$("addrBox").hidden=r.value!=="Delivery"||!r.checked});
$("send").onclick=e=>{
  const {l,total}=totals(),mode=document.querySelector("input[name=mode]:checked").value;
  const name=$("name").value.trim(),phone=$("phone").value.trim(),addr=$("addr").value.trim();
  const err=!l.length?"Add something to your cart first.":!name?"Please enter your name.":!phone?"Please enter your phone number.":(mode==="Delivery"&&!addr)?"Please enter your delivery address.":"";
  $("err").textContent=err;if(err){e.preventDefault();return}
  const msg="Hello Maya Shawarma, new order:\n"+l.map(i=>`${cart[i.id]} x ${i.n} (Rs ${cart[i.id]*i.p})`).join("\n")+`\nTotal: Rs ${total}\n${mode}\nName: ${name}\nPhone: ${phone}`+(mode==="Delivery"?`\nAddress: ${addr}`:"");
  $("send").href=`https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(msg)}`;
};
render();

/* info */
const tel=p=>"tel:"+p.replace(/[^\d+]/g,"");
const rows=[
  ["Address",`<a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(CONFIG.address)}" target="_blank" rel="noopener">${CONFIG.address}</a>`],
  ["Phone",CONFIG.phones.map(p=>`<a href="${tel(p)}" target="_blank" rel="noopener">${p}</a>`).join(" or ")+(CONFIG.contact?` (${CONFIG.contact})`:"")],
  ["Email",`<a href="mailto:${CONFIG.email}" target="_blank" rel="noopener">${CONFIG.email}</a>`],
  ["Hours",CONFIG.hours]].filter(r=>r[1]);
$("infoRows").innerHTML=rows.map(r=>`<p><b>${r[0]}:</b> ${r[1]}</p>`).join("");
const call=$("callTop");call.href="https://wa.me/"+CONFIG.whatsapp+"?text="+encodeURIComponent("Hello Maya Shawarma");call.target="_blank";call.rel="noopener";
</script>
</body>
</html>
